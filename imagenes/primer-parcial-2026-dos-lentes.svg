<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Primer parcial 2026: construcción de las imágenes de dos lentes convergentes</title>
  <desc id="desc">Dos paneles. L1 recibe un objeto a 30 cm, de altura 4 cm, y forma una imagen a 15 cm de altura menos 2 cm. Esa imagen está 35 cm antes de L2, que forma una imagen real a 26.25 cm de altura positiva 1.50 cm. En cada panel se trazan un rayo paralelo que sale por el foco derecho y otro por el centro óptico.</desc>
  <defs>
    <marker id="ray-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="ray-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <rect x="24" y="18" width="1052" height="286" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="48" y="52" font-size="23" font-weight="bold">1. L1 forma la imagen intermedia I1</text>
    <line x1="75" y1="175" x2="1020" y2="175" stroke="#94a3b8" stroke-width="2"/>
    <line x1="600" y1="76" x2="600" y2="244" stroke="#0284c7" stroke-width="4"/>
    <path d="M590 88 L600 76 L610 88 M590 232 L600 244 L610 232" fill="none" stroke="#0284c7" stroke-width="3"/>
    <text x="620" y="95" font-size="21" fill="#0369a1">L1</text>
    <circle cx="440" cy="175" r="4" fill="#475569"/>
    <circle cx="760" cy="175" r="4" fill="#475569"/>
    <text x="419" y="204" font-size="18">F1</text>
    <text x="741" y="158" font-size="18">F′1</text>
    <path d="M120 175 L120 103 M113 115 L120 103 L127 115" fill="none" stroke="#15803d" stroke-width="4"/>
    <text x="80" y="88" font-size="19" fill="#166534">Objeto: +4 cm</text>
    <path d="M840 175 L840 211 M833 199 L840 211 L847 199" fill="none" stroke="#b91c1c" stroke-width="4"/>
    <text x="855" y="233" font-size="19" fill="#b91c1c">I1: −2 cm</text>
    <path d="M120 103 L600 103" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ray-blue)"/>
    <path d="M600 103 L840 211" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ray-blue)"/>
    <path d="M120 103 L600 175" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ray-purple)"/>
    <path d="M600 175 L840 211" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ray-purple)"/>
    <path d="M120 254 L120 268 L600 268 L600 254 M600 268 L840 268 L840 254" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="302" y="291" font-size="18">s1 = 30 cm</text>
    <text x="660" y="291" font-size="18">s′1 = 15 cm</text>
    <rect x="24" y="322" width="1052" height="286" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="48" y="356" font-size="23" font-weight="bold">2. I1 funciona como objeto real para L2</text>
    <line x1="75" y1="465" x2="1035" y2="465" stroke="#94a3b8" stroke-width="2"/>
    <line x1="620" y1="378" x2="620" y2="547" stroke="#0284c7" stroke-width="4"/>
    <path d="M610 390 L620 378 L630 390 M610 535 L620 547 L630 535" fill="none" stroke="#0284c7" stroke-width="3"/>
    <text x="640" y="397" font-size="21" fill="#0369a1">L2</text>
    <circle cx="410" cy="465" r="4" fill="#475569"/>
    <circle cx="830" cy="465" r="4" fill="#475569"/>
    <text x="391" y="448" font-size="18">F2</text>
    <text x="811" y="495" font-size="18">F′2</text>
    <path d="M130 465 L130 501 M123 489 L130 501 L137 489" fill="none" stroke="#b91c1c" stroke-width="4"/>
    <text x="69" y="531" font-size="19" fill="#b91c1c">I1: −2 cm</text>
    <path d="M987.5 465 L987.5 438 M980.5 450 L987.5 438 L994.5 450" fill="none" stroke="#15803d" stroke-width="4"/>
    <text x="866" y="416" font-size="19" fill="#166534">Final: +1.50 cm</text>
    <path d="M130 501 L620 501" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ray-blue)"/>
    <path d="M620 501 L987.5 438" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ray-blue)"/>
    <path d="M130 501 L620 465" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ray-purple)"/>
    <path d="M620 465 L987.5 438" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ray-purple)"/>
    <path d="M130 557 L130 572 L620 572 L620 557 M620 572 L987.5 572 L987.5 557" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="308" y="596" font-size="18">s2 = 35 cm</text>
    <text x="737" y="596" font-size="18">s′2 = 26.25 cm</text>
    <text x="48" y="630" font-size="17" fill="#475569">Construcción por etapas. Cada distancia s o s′ se mide desde la lente de su panel.</text>
  </g>
</svg>
