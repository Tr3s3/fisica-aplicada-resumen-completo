<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Parámetros y componentes de una onda electromagnética</title>
<desc id="descripcion">A la izquierda, perfiles espaciales simultáneos de los campos eléctrico y magnético muestran amplitudes y longitud de onda. A la derecha, las componentes de ambos campos oscilan en fase en un punto fijo y permiten medir el período. Abajo aparecen las relaciones entre rapidez, frecuencia, longitud de onda y amplitudes.</desc>
<defs>
  <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <marker id="flechaIzquierda" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto"><path d="M9,0 L0,3 L9,6 z" fill="#334155"/></marker>
  <marker id="flechaAzul" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="flechaNaranja" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
</defs>
<rect width="1200" height="760" rx="28" fill="#f8fafc"/>
<text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#172033">Cómo leer una onda electromagnética</text>
<text x="600" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Los campos E y B varían juntos; la perturbación avanza aunque no viaje materia con ella.</text>

<!-- Panel espacial -->
<rect x="35" y="105" width="555" height="455" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="312" y="142" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172033">1. Perfil espacial en un instante</text>
<text x="312" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">La separación entre repeticiones es la longitud de onda λ.</text>
<line x1="90" y1="275" x2="530" y2="275" stroke="#64748b" stroke-width="2"/>
<line x1="100" y1="208" x2="100" y2="326" stroke="#64748b" stroke-width="2"/>
<text x="80" y="218" font-family="sans-serif" font-size="17" font-weight="700" fill="#2563eb">E_y</text>
<text x="524" y="300" font-family="sans-serif" font-size="16" fill="#334155">x</text>
<path d="M100 275 C130 205,170 205,200 275 S270 345,300 275 S370 205,400 275 S470 345,500 275" fill="none" stroke="#2563eb" stroke-width="5"/>
<line x1="150" y1="275" x2="150" y2="205" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="158" y="225" font-family="sans-serif" font-size="16" font-weight="700" fill="#2563eb">Eₘₐₓ</text>
<line x1="200" y1="365" x2="400" y2="365" stroke="#334155" stroke-width="2" marker-start="url(#flechaIzquierda)" marker-end="url(#flecha)"/>
<line x1="200" y1="345" x2="200" y2="372" stroke="#334155" stroke-width="2"/>
<line x1="400" y1="345" x2="400" y2="372" stroke="#334155" stroke-width="2"/>
<text x="300" y="390" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">λ</text>

<line x1="90" y1="455" x2="530" y2="455" stroke="#64748b" stroke-width="2"/>
<line x1="100" y1="405" x2="100" y2="515" stroke="#64748b" stroke-width="2"/>
<text x="78" y="416" font-family="sans-serif" font-size="17" font-weight="700" fill="#d97706">B_z</text>
<path d="M100 455 C130 395,170 395,200 455 S270 515,300 455 S370 395,400 455 S470 515,500 455" fill="none" stroke="#d97706" stroke-width="5"/>
<line x1="150" y1="455" x2="150" y2="395" stroke="#d97706" stroke-width="2" marker-end="url(#flechaNaranja)"/>
<text x="158" y="415" font-family="sans-serif" font-size="16" font-weight="700" fill="#d97706">Bₘₐₓ</text>
<line x1="105" y1="535" x2="500" y2="535" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
<text x="300" y="555" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">La onda y sus crestas avanzan hacia +x →</text>

<!-- Panel temporal -->
<rect x="610" y="105" width="555" height="455" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="887" y="142" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172033">2. Oscilación en un punto fijo</text>
<text x="887" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">El tiempo para completar un ciclo es el período T.</text>
<line x1="680" y1="340" x2="1105" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="715" y1="210" x2="715" y2="470" stroke="#64748b" stroke-width="2"/>
<text x="696" y="220" font-family="sans-serif" font-size="17" font-weight="700" fill="#2563eb">E_y</text>
<text x="696" y="245" font-family="sans-serif" font-size="15" font-weight="700" fill="#d97706">B_z</text>
<text x="1090" y="365" font-family="sans-serif" font-size="16" fill="#334155">t</text>
<path d="M715 340 C750 250,795 250,830 340 S910 430,945 340 S1025 250,1060 340" fill="none" stroke="#2563eb" stroke-width="5"/>
<path d="M715 340 C750 250,795 250,830 340 S910 430,945 340 S1025 250,1060 340" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="785" y1="340" x2="785" y2="270" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="795" y="288" font-family="sans-serif" font-size="16" font-weight="700" fill="#2563eb">Eₘₐₓ</text>
<line x1="795" y1="455" x2="1025" y2="455" stroke="#334155" stroke-width="2" marker-start="url(#flechaIzquierda)" marker-end="url(#flecha)"/>
<line x1="795" y1="432" x2="795" y2="462" stroke="#334155" stroke-width="2"/>
<line x1="1025" y1="432" x2="1025" y2="462" stroke="#334155" stroke-width="2"/>
<text x="910" y="485" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">T = 1/f</text>
<text x="887" y="520" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">Curvas normalizadas para comparar la fase,</text>
<text x="887" y="542" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">no las unidades ni los valores numéricos.</text>

<!-- Relaciones -->
<rect x="95" y="590" width="1010" height="115" rx="18" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
<text x="600" y="623" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">En el vacío: una longitud de onda avanza durante un período</text>
<text x="360" y="670" text-anchor="middle" font-family="serif" font-size="27" font-weight="700" fill="#1d4ed8">c = λf = λ/T</text>
<text x="835" y="670" text-anchor="middle" font-family="serif" font-size="27" font-weight="700" fill="#172033">Eₘₐₓ = c Bₘₐₓ</text>
<text x="600" y="735" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">Dibujo esquemático: E y B apuntan sobre ejes perpendiculares; las curvas muestran cómo cambia cada componente.</text>
</svg>
