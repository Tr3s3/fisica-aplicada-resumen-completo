<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Geometría de interferencia de doble rendija</title>
<desc id="desc">Dos rendijas separadas por d iluminan una pantalla a distancia L. La posición del máximo de orden m se aproxima por y igual a m lambda L sobre d.</desc>
<rect width="900" height="460" rx="24" fill="#f8fafc"/>
<text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#172033">Doble rendija: conecta orden, longitud de onda y posición</text>
<rect x="92" y="100" width="35" height="270" rx="4" fill="#64748b"/>
<text x="110" y="395" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">rendijas</text>
<line x1="110" y1="205" x2="110" y2="226" stroke="#fff" stroke-width="8"/>
<line x1="110" y1="257" x2="110" y2="278" stroke="#fff" stroke-width="8"/>
<text x="70" y="222" font-family="sans-serif" font-size="18" fill="#172033">S₁</text>
<text x="70" y="275" font-family="sans-serif" font-size="18" fill="#172033">S₂</text>
<line x1="55" y1="216" x2="55" y2="267" stroke="#e67e22" stroke-width="3"/>
<text x="38" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b45309">d</text>
<rect x="730" y="100" width="18" height="270" fill="#334155"/>
<text x="738" y="395" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">pantalla</text>
<line x1="127" y1="216" x2="730" y2="216" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="127" y1="267" x2="730" y2="216" stroke="#245bdb" stroke-width="3"/>
<line x1="127" y1="216" x2="730" y2="165" stroke="#245bdb" stroke-width="3"/>
<circle cx="739" cy="165" r="7" fill="#e67e22"/>
<circle cx="739" cy="216" r="6" fill="#245bdb"/>
<circle cx="739" cy="267" r="7" fill="#e67e22"/>
<line x1="790" y1="216" x2="790" y2="165" stroke="#e67e22" stroke-width="3"/>
<text x="809" y="196" font-family="sans-serif" font-size="18" fill="#b45309">yₘ</text>
<line x1="130" y1="330" x2="730" y2="330" stroke="#198754" stroke-width="3"/>
<line x1="130" y1="320" x2="130" y2="340" stroke="#198754" stroke-width="3"/>
<line x1="730" y1="320" x2="730" y2="340" stroke="#198754" stroke-width="3"/>
<text x="430" y="323" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#198754">L</text>
<rect x="225" y="375" width="470" height="55" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="460" y="411" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172033">yₘ ≈ m λ L / d  (ángulos pequeños)</text>
</svg>