<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
<title id="title">Mapa para elegir qué medición relativista comparar</title>
<desc id="desc">Guía visual para identificar el tiempo propio, la longitud propia y la transformación de velocidades antes de resolver un ejercicio de relatividad especial.</desc>
<rect width="1080" height="720" rx="24" fill="#f8fafc"/>
<text x="540" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#172033">Antes de calcular: identifica qué mide cada marco</text>
<text x="64" y="78" font-family="sans-serif" font-size="16" fill="#475569">El subíndice 0 indica una medición propia; no significa “dato inicial”.</text>
<rect x="726" y="53" width="322" height="37" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="887" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#312e81">γ = 1 / √(1 − v²/c²)</text>

<rect x="32" y="98" width="1016" height="174" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="32" y="98" width="12" height="174" rx="6" fill="#245bdb"/>
<text x="64" y="132" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">1 · TIEMPO ENTRE DOS EVENTOS</text>
<text x="66" y="168" font-family="sans-serif" font-size="17" fill="#334155">Busca el marco donde ambos eventos ocurren en el mismo lugar.</text>
<text x="66" y="205" font-family="sans-serif" font-size="18" font-weight="700" fill="#245bdb">Ese marco mide Δt₀ (tiempo propio).</text>
<text x="66" y="239" font-family="sans-serif" font-size="17" fill="#334155">Otro marco mide Δt = γ Δt₀, que es mayor si hay movimiento relativo.</text>
<line x1="636" y1="183" x2="972" y2="183" stroke="#94a3b8" stroke-width="2"/>
<circle cx="684" cy="183" r="9" fill="#245bdb"/>
<circle cx="813" cy="183" r="9" fill="#245bdb"/>
<text x="684" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#12315a">A</text>
<text x="813" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#12315a">B</text>
<text x="748" y="211" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#12315a">mismo lugar en el marco propio</text>
<line x1="684" y1="237" x2="936" y2="237" stroke="#e67e22" stroke-width="4"/>
<polygon points="936,237 922,229 922,245" fill="#e67e22"/>
<text x="810" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9a3412">en otro marco, el reloj se desplaza</text>

<rect x="32" y="292" width="1016" height="174" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="32" y="292" width="12" height="174" rx="6" fill="#16845b"/>
<text x="64" y="326" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">2 · LONGITUD DE UN OBJETO</text>
<text x="66" y="362" font-family="sans-serif" font-size="17" fill="#334155">Primero mide el objeto en reposo: esa longitud es L₀.</text>
<text x="66" y="399" font-family="sans-serif" font-size="17" fill="#334155">El otro marco registra ambos extremos al mismo tiempo.</text>
<text x="66" y="435" font-family="sans-serif" font-size="18" font-weight="700" fill="#16845b">Paralela al movimiento: L = L₀ / γ.</text>
<line x1="676" y1="363" x2="953" y2="363" stroke="#16845b" stroke-width="12" stroke-linecap="round"/>
<line x1="676" y1="347" x2="676" y2="379" stroke="#14532d" stroke-width="3"/>
<line x1="953" y1="347" x2="953" y2="379" stroke="#14532d" stroke-width="3"/>
<text x="814" y="394" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#14532d">objeto en reposo: L₀</text>
<line x1="676" y1="427" x2="848" y2="427" stroke="#e67e22" stroke-width="10" stroke-linecap="round"/>
<line x1="676" y1="414" x2="676" y2="440" stroke="#9a3412" stroke-width="3"/>
<line x1="848" y1="414" x2="848" y2="440" stroke="#9a3412" stroke-width="3"/>
<text x="874" y="433" font-family="sans-serif" font-size="15" fill="#9a3412">L menor</text>

<rect x="32" y="486" width="1016" height="174" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="32" y="486" width="12" height="174" rx="6" fill="#a35400"/>
<text x="64" y="520" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">3 · VELOCIDAD VISTA DESDE OTRO MARCO</text>
<text x="66" y="556" font-family="sans-serif" font-size="17" fill="#334155">Elige +x y marca qué marco se mueve y hacia dónde.</text>
<text x="66" y="589" font-family="sans-serif" font-size="17" fill="#334155">Conserva signos y usa:</text>
<text x="66" y="621" font-family="sans-serif" font-size="19" font-weight="700" fill="#a35400">u = (u′ + v) / (1 + u′v/c²)</text>
<text x="66" y="646" font-family="sans-serif" font-size="15" fill="#334155">Control: para un objeto material, |u| &lt; c.</text>
<line x1="697" y1="567" x2="965" y2="567" stroke="#64748b" stroke-width="3"/>
<polygon points="965,567 949,559 949,575" fill="#64748b"/>
<text x="962" y="548" text-anchor="end" font-family="sans-serif" font-size="15" fill="#334155">+x</text>
<line x1="713" y1="597" x2="830" y2="597" stroke="#245bdb" stroke-width="5"/>
<polygon points="830,597 814,589 814,605" fill="#245bdb"/>
<text x="770" y="622" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#12315a">v &gt; 0</text>
<line x1="891" y1="632" x2="765" y2="632" stroke="#e67e22" stroke-width="5"/>
<polygon points="765,632 781,624 781,640" fill="#e67e22"/>
<text x="840" y="650" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9a3412">u′ &lt; 0 (ejemplo)</text>
</svg>
