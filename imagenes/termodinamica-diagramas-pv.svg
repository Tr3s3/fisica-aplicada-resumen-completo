<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Dos ciclos termodinámicos en diagramas presión-volumen</title>
  <desc id="desc">A la izquierda, ciclo de tres procesos con isócoro, adiabático e isóbaro. A la derecha, ciclo rectangular que permite visualizar el trabajo como área encerrada.</desc>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172b4d">Leer procesos y trabajo en un diagrama p–V</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="270" y="75" text-anchor="middle" font-size="17" font-weight="700">Ciclo con tramo adiabático</text>
    <text x="740" y="75" text-anchor="middle" font-size="17" font-weight="700">Ciclo rectangular</text>
  </g>
  <g stroke="#172b4d" stroke-width="2">
    <line x1="95" y1="380" x2="470" y2="380"/><line x1="95" y1="380" x2="95" y2="112"/>
    <line x1="565" y1="380" x2="940" y2="380"/><line x1="565" y1="380" x2="565" y2="112"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#172b4d">
    <text x="456" y="402">V</text><text x="78" y="125">p</text><text x="927" y="402">V</text><text x="548" y="125">p</text>
  </g>
  <path d="M170 330 L170 170 C230 230 300 315 365 330 L170 330" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
  <path d="M170 230 l-7 13 h14 z" fill="#2563eb"/>
  <path d="M265 252 l-2 -14 13 7 z" fill="#2563eb"/>
  <path d="M285 330 l-13 -7 v14 z" fill="#2563eb"/>
  <g font-family="sans-serif" font-size="14" fill="#1e3a8a">
    <text x="150" y="344">1</text><text x="150" y="164">2</text><text x="370" y="344">3</text>
    <text x="113" y="347">1.00 atm</text><text x="144" y="365">T₁=300 K</text>
    <text x="177" y="160">T₂=600 K</text><text x="375" y="347">T₃=492 K</text>
    <text x="188" y="218">V constante</text><text x="266" y="270">Q=0</text><text x="252" y="352">p constante</text>
  </g>
  <path d="M655 330 L655 180 L850 180 L850 330 Z" fill="#dbeafe" fill-opacity="0.65" stroke="#059669" stroke-width="4"/>
  <path d="M655 247 l-7 13 h14 z" fill="#059669"/><path d="M748 180 l13 -7 v14 z" fill="#059669"/>
  <path d="M850 248 l-7 -13 h14 z" fill="#059669"/><path d="M760 330 l-13 7 v-14 z" fill="#059669"/>
  <g font-family="sans-serif" font-size="14" fill="#065f46">
    <text x="641" y="345">b</text><text x="641" y="174">c</text><text x="855" y="174">d</text><text x="855" y="345">a</text>
    <text x="655" y="366">V₀</text><text x="838" y="366">2V₀</text><text x="572" y="333">p₀</text><text x="572" y="184">3p₀</text>
    <text x="749" y="264" text-anchor="middle" font-weight="700">área encerrada = Wneto</text>
  </g>
  <text x="500" y="438" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b5563">En una expansión, W realizado por el gas es positivo; el sentido horario da trabajo neto positivo.</text>
</svg>
