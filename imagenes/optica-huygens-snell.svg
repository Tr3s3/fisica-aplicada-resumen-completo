<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>De los frentes de onda a Snell</title><desc>AB y CD son frentes. BC y AD son recorridos perpendiculares a sus frentes durante el mismo intervalo. AC es común a los dos triángulos.</desc>
