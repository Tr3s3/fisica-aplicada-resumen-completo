<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Tres mecanismos de transferencia de calor</title>
  <desc id="desc">Conducción a través de una pared, convección por movimiento de fluido y radiación térmica sin contacto material.</desc>
  <rect width="900" height="350" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172b4d">Tres caminos para transferir energía térmica</text>
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="25" y="60" width="270" height="245" rx="14"/><rect x="315" y="60" width="270" height="245" rx="14"/><rect x="605" y="60" width="270" height="245" rx="14"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="160" y="91" font-size="19" font-weight="700" fill="#172b4d">Conducción</text>
    <text x="450" y="91" font-size="19" font-weight="700" fill="#172b4d">Convección</text>
    <text x="740" y="91" font-size="19" font-weight="700" fill="#172b4d">Radiación</text>
  </g>
  <rect x="66" y="137" width="55" height="80" rx="5" fill="#fca5a5"/>
  <rect x="121" y="137" width="75" height="80" fill="#e5e7eb" stroke="#64748b"/>
  <rect x="196" y="137" width="55" height="80" rx="5" fill="#93c5fd"/>
  <text x="92" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7f1d1d">caliente</text>
  <text x="158" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">pared</text>
  <text x="224" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">frío</text>
  <path d="M94 122 H218" stroke="#c2410c" stroke-width="3" fill="none"/>
  <path d="M218 122 l-10 -6 v12 z" fill="#c2410c"/>
  <g fill="#475569">
    <circle cx="137" cy="155" r="4"/><circle cx="158" cy="177" r="4"/><circle cx="180" cy="199" r="4"/>
    <circle cx="137" cy="199" r="4"/><circle cx="180" cy="155" r="4"/>
  </g>
  <text x="160" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">Energía pasa entre partículas vecinas</text>
  <rect x="375" y="137" width="150" height="95" rx="9" fill="#dbeafe" stroke="#64748b"/>
  <path d="M410 205 C380 180 398 147 432 145" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M432 145 l-10 1 6 9 z" fill="#2563eb"/>
  <path d="M490 157 C520 182 502 216 468 222" fill="none" stroke="#c2410c" stroke-width="3"/>
  <path d="M468 222 l10 -1 -6 -9 z" fill="#c2410c"/>
  <text x="450" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">fluido</text>
  <text x="450" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">El fluido se mueve y transporta energía</text>
  <circle cx="740" cy="180" r="32" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>
  <g stroke="#c2410c" stroke-width="3">
    <line x1="740" y1="128" x2="740" y2="112"/><line x1="740" y1="232" x2="740" y2="248"/>
    <line x1="688" y1="180" x2="672" y2="180"/><line x1="792" y1="180" x2="808" y2="180"/>
    <line x1="703" y1="143" x2="692" y2="132"/><line x1="777" y1="217" x2="788" y2="228"/>
    <line x1="777" y1="143" x2="788" y2="132"/><line x1="703" y1="217" x2="692" y2="228"/>
  </g>
  <path d="M675 264 q22 -16 44 0 t44 0 t44 0" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="740" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">Ondas electromagnéticas; no requiere contacto</text>
  <text x="450" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">El calor siempre es energía que cruza la frontera del sistema por una diferencia de temperatura.</text>
</svg>
